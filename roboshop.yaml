- name: create ec2-instances and R53 records
  hosts: local
  connection: local
  vars:
    instances: ["mongodb","redis","mysql","rabbitMQ"]
    action: create
    ami_id: ami-0055977a6e828a4f4
    domain_name: devopsadipractice.online
  tasks:
  - name: create ec2 instances
    amazon.aws.ec2_instance:
      name: "roboshop-{{item}}"
      instance_type: "t3.micro"
      region: "us-east-1"
      image_id: "{{ ami_id }}"
      security_groups: 
      - "roboshop-common"
      - "roboshop-{{ item }}"

    loop: "{{ instances }}"
    when: action == "create"


