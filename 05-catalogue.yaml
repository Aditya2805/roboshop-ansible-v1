- name: configure nodejs server
  hosts: catalogue
  become: yes
  tasks:
  - name: enable nodejs:24
    command: dnf module enable nodejs:24 -y
  
  - name: install nodejs
    package:
      name: nodejs
      state: absent
  
  - name: create roboshop system user
    user:
      name: roboshop
      create_home: false
      home: /app 
      system: true
      shell: /sbin/nologin
      comment: "roboshop system user"
  
  - name: remove existing app directory
    file: 
      path: /app
      state: absent

  - name: remove catalogue.zip
    file: 
      path: /tmp/catalogue.zip
      state: absent
   
  - name: create app directory
    file: 
      path: /app
      state: directory
  
  - name: download catalogue application
    get_url:
      url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/catalogue-v4.zip
      dest: /tmp/catalogue.zip
  
  - name: unzip catalogue
    unarchive:
      src: /tmp/catalogue.zip
      dest: /app
      remote_src: yes

  - name: npm install dependencies
    community.general.npm:
      path: /app
  
  - name: Copy service file and substitute variables
    ansible.builtin.template:
      src: catalogue.service.j2
      dest: /etc/systemd/system/catalogue.service
  
  - name: copy mongo repo
    copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo
  
  - name: install mongodb client
    package:
      name: mongodb-mongosh
      state: present
  
  - name: check products loaded or not
    command: mongosh --host {{ mongodb_host }} --quiet --eval 'db.getSiblingDB("catalogue").products.countDocuments()' 
    register: product_Count
  
  - name: print product count 
    debug:
      msg: "{{ product_Count }}"


  




  
