- name: configure frontend server
  hosts: frontend
  become: yes
  tasks:
  - name: disable default nginx
    command: dnf module disable nginx -y

  - name: enable nginx1.26
    command: dnf module enable nginx:1.26 -y
  
  - name: install nginx
    package:
      name: nginx
      state: present
  
  - name: start and enable nginx
    service:
      name: nginx
      state: restarted
      enabled: yes

  - name: delete the contents in directory
    find:
      paths: /usr/share/nginx/html/
      recurse: true
      hidden: true
      file_type: any
    register: directory_contents
  
  - name: print directory contents
    debug:
      msg: "{{ directory_contents}}"
  
  - name: delete the discovered contents
    file:
      path: " {{ item.path }}"
      state: absent
    loop: " {{directory_Contents.file}}"
